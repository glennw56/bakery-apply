<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sunshine's Bakery{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js"></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="site-header">
    <a href="/" class="brand">Sunshine's Bakery</a>
    <nav>
      <a href="/">Hiring</a>
      {% if user and user.is_admin %}
        <a href="/admin">Applications</a>
      {% elif user %}
        <a href="/apply">Apply</a>
        <a href="/application">My application</a>
      {% endif %}
      {% if user %}
        <form class="nav-logout" method="post" action="/logout">
          <button type="submit">Log out</button>
        </form>
      {% else %}
        <a href="/login">Log in</a>
        <a href="/signup">Sign up</a>
      {% endif %}
    </nav>
  </header>
  <main>
    {% if flash %}
      <p class="flash" role="status">{{ flash }}</p>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
